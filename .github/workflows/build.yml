name: Build Basketball Video Analyzer

on:
  push:
    branches: [main, master]
    tags-ignore:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The tests are .mts files run directly, which needs Node's type
      # stripping. They import nothing from node_modules, so no install.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit tests
        run: npm test

  build:
    strategy:
      matrix:
        # Linux stays on 24.04 (rpm 4.18). From rpm 4.20 on, %install runs in a
        # per-package build directory, and the spec electron-installer-redhat
        # writes copies `usr/*` from the old one, so the RPM maker fails.
        # Keep release.yml on the same image.
        os: [macos-latest, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Cache node_modules with OS-specific key
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Windows-specific setup
      - name: Windows setup
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v1.3
        with:
          msbuild-architecture: x64

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Install dependencies
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
          npm_config_registry: "https://registry.npmjs.org/"
        run: |
          npm config list
          npm ci

      - name: Build FFmpeg and x264
        uses: ./.github/actions/build-ffmpeg

      - name: Download yt-dlp and deno
        run: bash scripts/fetch-yt-dlp.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild native modules for the target platform
      # better-sqlite3 is the only dependency that runs inside Electron and so
      # the only one whose ABI has to match it. lzma-native used to be listed
      # here too, but the Squirrel maker runs it under Node at build time, so
      # rebuilding it against Electron was wrong as well as slow.
      # --no makes npx use the @electron/rebuild that package-lock.json pins
      # instead of fetching one. Without the bare --, npm keeps -f and
      # --which-module for itself. bash because PowerShell drops that -- when
      # it runs npx.ps1 on Windows.
      - name: Rebuild native modules
        shell: bash
        run: |
          npx --no -- electron-rebuild -f --which-module better-sqlite3
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      # npm run build, not the two sub-scripts: only the full script fires the
      # prebuild hook, and prebuild is where the locale linter runs. Calling
      # build:main and build:renderer directly is how a linter crash reached a
      # release tag without any PR check going red.
      - name: Build TypeScript and Webpack
        run: npm run build

      - name: Build for macOS
        if: runner.os == 'macOS'
        run: |
          npm run make
        env:
          DEBUG: "electron-forge:*"
          ELECTRON_FORGE_MAKERS: '["@electron-forge/maker-dmg","@electron-forge/maker-zip"]'
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm run make
        env:
          DEBUG: "electron-forge:*"
          ELECTRON_FORGE_MAKERS: '["@electron-forge/maker-squirrel"]'

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: |
          npm run make
        env:
          DEBUG: "electron-forge:*"
          ELECTRON_FORGE_MAKERS: '["@electron-forge/maker-deb","@electron-forge/maker-rpm"]'

      # Loads the SQLite binding that went into the packaged app with the
      # Electron in node_modules, so an ABI mismatch fails here, not on a
      # user's machine.
      - name: Check the packaged SQLite module loads in Electron
        shell: bash
        run: |
          NODE_FILE=$(find out -path '*app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node' | head -1)
          test -n "$NODE_FILE"
          ELECTRON_RUN_AS_NODE=1 npx --no -- electron -e "require(require('path').resolve(process.argv[1])); console.log('Packaged better-sqlite3 loads in Electron', process.versions.electron)" "$NODE_FILE"

      - name: Verify packaged licences and FFmpeg
        shell: bash
        run: node scripts/check-packaged-ffmpeg.mjs

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: basketball-video-analyzer-${{ matrix.os }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basketball-video-analyzer-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*Setup.exe
          retention-days: 30

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: basketball-video-analyzer-${{ matrix.os }}
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
          retention-days: 30

      # Upload logs on failure
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/**/*-debug.log
            ${{ github.workspace }}/**/*-error.log
            ${{ runner.temp }}/**/*-debug.log
            ${{ runner.temp }}/**/*-error.log
            ${{ env.LOCALAPPDATA }}/npm-cache/_logs/*.log
          if-no-files-found: ignore

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -la

      # Optional: Create a release if you want automatic releases
      # - name: Create Release
      #   uses: softprops/action-gh-release@v1
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: |
      #       basketball-video-analyzer-mac/**/*
      #       basketball-video-analyzer-windows/**/*
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
