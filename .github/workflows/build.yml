name: Build Basketball Video Analyzer

on:
  push:
    branches: [main, master]
    tags-ignore:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Cache node_modules with OS-specific key
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Windows-specific setup
      - name: Windows setup
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v1.3
        with:
          msbuild-architecture: x64

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Install dependencies
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
          npm_config_registry: "https://registry.npmjs.org/"
        run: |
          npm config list
          npm install -g @electron/rebuild
          npm ci

      - name: Download yt-dlp binary
        run: |
          # The plain "yt-dlp" asset is a Python zipapp that needs Python
          # 3.10+, which macOS does not ship. These are standalone builds.
          case "$RUNNER_OS" in
            Windows) ASSET=yt-dlp.exe; DEST=yt-dlp.exe ;;
            macOS) ASSET=yt-dlp_macos; DEST=yt-dlp ;;
            *) ASSET=yt-dlp_linux; DEST=yt-dlp ;;
          esac
          BASE=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          OUT="node_modules/youtube-dl-exec/bin/$DEST"
          mkdir -p node_modules/youtube-dl-exec/bin
          curl -fsSL -H "$AUTH" "$BASE/$ASSET" -o "$OUT"
          curl -fsSL -H "$AUTH" "$BASE/SHA2-256SUMS" -o yt-dlp-sums.txt
          EXPECTED=$(grep " $ASSET\$" yt-dlp-sums.txt | cut -d' ' -f1)
          ACTUAL=$( (sha256sum "$OUT" 2>/dev/null || shasum -a 256 "$OUT") | cut -d' ' -f1 | tr -d '\\')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "yt-dlp checksum mismatch for $ASSET: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          chmod +x "$OUT"
        shell: bash

      - name: Download QuickJS for yt-dlp
        run: |
          # yt-dlp needs a JavaScript runtime to solve YouTube's challenges.
          # QuickJS-NG is ~2 MB against deno's ~77 MB. Pinned, with the
          # SHA-256 GitHub records for each release asset.
          VERSION=v0.17.0
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) ASSET=qjs-darwin-arm64; SUM=8be3ddfe3397d2e692e4e1e8972ee9d032a0a580505d2f8b4ea528cf1b651c11; DEST=qjs ;;
            macOS-X64) ASSET=qjs-darwin-x86_64; SUM=9e5e101b4fd13cda3204222ca9f8be35412c41dcdef3745829633b7a67245412; DEST=qjs ;;
            Linux-X64) ASSET=qjs-linux-x86_64; SUM=0bfc02511a9f549c28b53880d988fc7cd5d361e90c5e8afdfcd7dc6774ceace5; DEST=qjs ;;
            Windows-X64) ASSET=qjs-windows-x86_64.exe; SUM=2aeabf0092c3262d6b2609824418f7dd7ed1f1df939f73b2b15645230cac0d77; DEST=qjs.exe ;;
            *) echo "No QuickJS build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          OUT="node_modules/youtube-dl-exec/bin/$DEST"
          curl -fsSL "https://github.com/quickjs-ng/quickjs/releases/download/$VERSION/$ASSET" -o "$OUT"
          ACTUAL=$( (sha256sum "$OUT" 2>/dev/null || shasum -a 256 "$OUT") | cut -d' ' -f1 | tr -d '\\')
          if [ "$SUM" != "$ACTUAL" ]; then
            echo "QuickJS checksum mismatch for $ASSET: expected '$SUM', got '$ACTUAL'"
            exit 1
          fi
          chmod +x "$OUT"
        shell: bash

      # Rebuild native modules for the target platform
      # better-sqlite3 is the only dependency that runs inside Electron and so
      # the only one whose ABI has to match it. lzma-native used to be listed
      # here too, but the Squirrel maker runs it under Node at build time, so
      # rebuilding it against Electron was wrong as well as slow.
      - name: Rebuild native modules
        run: |
          electron-rebuild -f --which better-sqlite3
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      # Debug FFmpeg installation
      - name: Debug FFmpeg
        run: |
          npm list ffmpeg-static
          node -e "console.log('FFmpeg path:', require('ffmpeg-static'))"

      # npm run build, not the two sub-scripts: only the full script fires the
      # prebuild hook, and prebuild is where the locale linter runs. Calling
      # build:main and build:renderer directly is how a linter crash reached a
      # release tag without any PR check going red.
      - name: Build TypeScript and Webpack
        run: npm run build

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: |
          npm run make
        env:
          DEBUG: "electron-forge:*"
          ELECTRON_FORGE_MAKERS: '["@electron-forge/maker-dmg","@electron-forge/maker-zip"]'
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm run make
        env:
          DEBUG: "electron-forge:*"
          ELECTRON_FORGE_MAKERS: '["@electron-forge/maker-squirrel"]'

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run make
        env:
          DEBUG: "electron-forge:*"
          ELECTRON_FORGE_MAKERS: '["@electron-forge/maker-deb","@electron-forge/maker-rpm"]'

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basketball-video-analyzer-mac
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basketball-video-analyzer-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*Setup.exe
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basketball-video-analyzer-linux
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
          retention-days: 30

      # Upload logs on failure
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/**/*-debug.log
            ${{ github.workspace }}/**/*-error.log
            ${{ runner.temp }}/**/*-debug.log
            ${{ runner.temp }}/**/*-error.log
            ${{ env.LOCALAPPDATA }}/npm-cache/_logs/*.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -la

      # Optional: Create a release if you want automatic releases
      # - name: Create Release
      #   uses: softprops/action-gh-release@v1
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: |
      #       basketball-video-analyzer-mac/**/*
      #       basketball-video-analyzer-windows/**/*
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
