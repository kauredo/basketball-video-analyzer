name: Release

on:
  push:
    tags:
      - "v*"
  # A manual run builds every platform and uploads the artifacts to the run,
  # without signing, notarizing or publishing anything.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag on a stale package.json would ship installers that report the old
  # version, and auto-update would offer the same release forever.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Same Node as the test job in build.yml (the tests need type stripping).
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Run unit tests
        run: npm test

  build:
    needs: verify
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Linux pinned to 24.04 for the RPM maker; see the note in build.yml.
        # Each architecture builds on its own runner, because FFmpeg,
        # yt-dlp, deno and better-sqlite3 all install for the host machine.
        os: [macos-latest, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Kept in step with build.yml. When these two disagree, build.yml stops
      # being a check on what the release actually does.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies with retry
        uses: nick-invision/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci --verbose
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder
          npm_config_cache: ~/.npm

      - name: Build FFmpeg and x264
        uses: ./.github/actions/build-ffmpeg

      - name: Download yt-dlp and deno
        run: bash scripts/fetch-yt-dlp.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application
        run: npm run build

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD=$(uuidgen)
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          (umask 077; printf '%s' "$MACOS_CERTIFICATE" | base64 -d > "$CERT_PATH")

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null

          EXISTING_KEYCHAINS=$(security list-keychain -d user | sed -e 's/[[:space:]]*"//g' -e 's/"$//g' | tr '\n' ' ')
          # shellcheck disable=SC2086
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

      - name: Package signed macOS application
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SKIP_NOTARIZE: "1"
        run: |
          P8_PATH="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > "$P8_PATH")
          echo "P8_PATH=$P8_PATH" >> "$GITHUB_ENV"
          APPLE_API_KEY_PATH="$P8_PATH" npm run make

      - name: Submit macOS DMG for notarization (no wait)
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          DMG=$(find out/make -name "*.dmg" -type f | head -1)
          [ -n "$DMG" ] || { echo "::error::No .dmg found under out/make"; exit 1; }
          echo "Submitting $DMG to Apple notary (async, won't block on result)..."
          xcrun notarytool submit "$DMG" \
            --key "$P8_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --no-wait --output-format json > out/make/notarization.json
          jq -e '.id | strings | select(length > 0)' out/make/notarization.json

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${CERT_PATH:-}" ]; then
            rm -f "$CERT_PATH"
          fi
          if [ -n "${P8_PATH:-}" ]; then
            rm -f "$P8_PATH"
          fi

      - name: Package application (macOS, unsigned manual run)
        if: runner.os == 'macOS' && github.event_name != 'push'
        run: npm run make

      - name: Package application (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package application (Linux)
        if: runner.os == 'Linux'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged licences and FFmpeg
        run: node scripts/check-packaged-ffmpeg.mjs

      - name: Stage FFmpeg source
        shell: bash
        run: |
          platform=$(node -p 'process.platform + "-" + process.arch')
          cp out/ffmpeg/ffmpeg-source.tar.gz "out/make/ffmpeg-source-$platform.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: ${{ runner.os == 'macOS' && github.event_name == 'push' && 'unstapled' || 'release' }}-${{ matrix.os }}
          path: out/make/
          compression-level: 6
          retention-days: 90

  staple:
    needs: build
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unstapled-${{ matrix.os }}
          path: staging

      - name: Wait for Apple and staple the installers
        timeout-minutes: 60
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/staple-release.sh staging

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          path: staging/
          if-no-files-found: error

  release:
    needs: staple
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download final artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*

      - name: Verify corresponding source for all release targets
        run: |
          test -s release-macos-latest/ffmpeg-source-darwin-arm64.tar.gz
          test -s release-macos-15-intel/ffmpeg-source-darwin-x64.tar.gz
          test -s release-ubuntu-24.04/ffmpeg-source-linux-x64.tar.gz
          test -s release-ubuntu-24.04-arm/ffmpeg-source-linux-arm64.tar.gz
          test -s release-windows-latest/ffmpeg-source-win32-x64.tar.gz

      - name: Check the tag has no published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$published"; then
            echo "::error::A published release already exists for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish release with corresponding source
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.event_name == 'push'
        with:
          files: |
            release-*/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  website:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rebuild the marketing site
        env:
          DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "WEBSITE_DEPLOY_HOOK is not set; skipping the site rebuild."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
